<!DOCTYPE html>
<html lang="fr" class="dark scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Module de formation DevOps complet — du versioning au déploiement continu." />
  <title>Module DevOps — Formation complète</title>

  <!-- Favicon (SVG, aux couleurs du module) -->
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
  <link rel="mask-icon" href="assets/favicon.svg" color="#7c6bf9" />
  <meta name="theme-color" content="#7c6bf9" />

  <!-- Open Graph / Twitter (aperçus de partage) — remplacer par des URL absolues en prod -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="H4Techno Formations" />
  <meta property="og:title" content="H4Techno Formations" />
  <meta property="og:description" content="DevOps, System Design, SRE. Schémas clairs, code réel, du débutant à l'avancé." />
  <meta property="og:image" content="assets/og.png" />
  <meta property="og:image:alt" content="H4Techno Formations" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:image" content="assets/og.png" />

  <!-- Thème appliqué avant le rendu pour éviter tout flash (FOUC) -->
  <script>
    (function () {
      try {
        var saved = localStorage.getItem('devops-theme');
        var theme = saved === 'light' || saved === 'dark'
          ? saved
          : 'dark'; // thème sombre par défaut
        document.documentElement.classList.toggle('dark', theme === 'dark');
        document.documentElement.setAttribute('data-theme', theme);
      } catch (e) {}
    })();
  </script>

  <!-- Tailwind Play CDN + plugins (typography, forms, container-queries) -->
  <script src="https://cdn.tailwindcss.com?plugins=typography,forms,container-queries"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'ui-monospace', 'SFMono-Regular', 'monospace'],
          },
          colors: {
            ink: {
              950: '#08080a',
              900: '#0c0c0f',
              850: '#101014',
              800: '#16161c',
              700: '#1e1e26',
              600: '#2a2a34',
            },
            accent: {
              DEFAULT: '#7c6bf9',
              500: '#7c6bf9',
              400: '#9a8dfb',
              600: '#6355e6',
            },
          },
        },
      },
    };
  </script>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />

  <!-- highlight.js (thèmes clair + sombre ; on active le bon via app.js) -->
  <link id="hljs-dark" rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css" />
  <link id="hljs-light" rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-light.min.css" disabled />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/dockerfile.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/yaml.min.js"></script>

  <!-- Styles custom -->
  <link rel="stylesheet" href="assets/css/style.css?v=11" />
</head>

<body class="font-sans antialiased">

  <!-- Barre de progression de lecture -->
  <div id="reading-progress" class="reading-progress" aria-hidden="true">
    <div id="reading-progress-bar" class="reading-progress__bar"></div>
  </div>

  <!-- Header mobile -->
  <header class="mobile-header">
    <button id="menu-toggle" class="mobile-header__btn" aria-label="Ouvrir le menu" aria-expanded="false" aria-controls="sidebar">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <line x1="4" y1="7" x2="20" y2="7" /><line x1="4" y1="12" x2="20" y2="12" /><line x1="4" y1="17" x2="20" y2="17" />
      </svg>
    </button>
    <span class="mobile-header__title"><strong id="mobile-title">Formation</strong></span>
    <button class="theme-toggle" data-theme-toggle type="button" aria-label="Changer de thème">
      <svg width="18" height="18" class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>
      <svg width="18" height="18" class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
    </button>
  </header>

  <!-- Backdrop mobile -->
  <div id="backdrop" class="backdrop" aria-hidden="true"></div>

  <div class="app-shell">

    <!-- ===================== SIDEBAR ===================== -->
    <aside id="sidebar" class="sidebar" aria-label="Navigation des chapitres">
      <div class="sidebar__brand">
        <a href="index.html" class="sidebar__brand-home" aria-label="Retour à l'accueil">
          <div class="sidebar__logo">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 2v4" /><path d="m16.2 7.8 2.9-2.9" /><path d="M18 12h4" /><path d="m16.2 16.2 2.9 2.9" />
              <path d="M12 18v4" /><path d="m7.8 16.2-2.9 2.9" /><path d="M6 12H2" /><path d="m7.8 7.8-2.9-2.9" />
              <circle cx="12" cy="12" r="3" />
            </svg>
          </div>
          <div class="sidebar__brand-text">
            <span class="sidebar__brand-title" id="module-title">Formation</span>
            <span class="sidebar__brand-sub">← Toutes les formations</span>
          </div>
        </a>
        <button class="theme-toggle" data-theme-toggle type="button" aria-label="Changer de thème">
          <svg width="18" height="18" class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>
          <svg width="18" height="18" class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
        </button>
      </div>

      <div class="sidebar__progress">
        <div class="sidebar__progress-head">
          <span>Progression</span>
          <span id="chapters-count">0 / 12</span>
        </div>
        <div class="sidebar__progress-track">
          <div id="chapters-progress" class="sidebar__progress-fill"></div>
        </div>
      </div>

      <div class="sidebar__prereq" id="module-prereq" hidden></div>

      <nav id="chapter-nav" class="sidebar__nav" aria-label="Chapitres">
        <!-- Rempli dynamiquement par app.js -->
      </nav>

      <div class="sidebar__footer">
        <span id="sidebar-count">12 chapitres</span>
      </div>
    </aside>

    <!-- ===================== CONTENU ===================== -->
    <main class="content @container/content">
      <div id="content" class="content__inner">
        <!-- Le chapitre courant est injecté ici -->
        <div class="loader">
          <div class="loader__spinner"></div>
          <p>Chargement…</p>
        </div>
      </div>

      <!-- Navigation précédent / suivant -->
      <nav id="pager" class="pager" aria-label="Chapitre précédent / suivant" hidden>
        <button id="pager-prev" class="pager__btn" data-dir="prev">
          <span class="pager__dir">← Précédent</span>
          <span class="pager__label"></span>
        </button>
        <button id="pager-next" class="pager__btn pager__btn--next" data-dir="next">
          <span class="pager__dir">Suivant →</span>
          <span class="pager__label"></span>
        </button>
      </nav>

      <footer class="content__footer">
        <span>Module de formation DevOps — <a href="index.html">accueil</a></span>
      </footer>
    </main>

  </div>

  <script src="assets/js/catalog.js?v=11" defer></script>
  <script src="assets/js/app.js?v=11" defer></script>
</body>
</html>
